name: Check legal sources

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check every bundled source
        shell: bash
        run: python3 skills/legal-docs/scripts/check_sources.py | tee check-report.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-check-report
          path: check-report.txt
